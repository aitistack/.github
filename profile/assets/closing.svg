<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00F5A0"/>
    <stop offset="1" stop-color="#00C98A"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1200" height="260" rx="20" fill="#0B0D0D" stroke="#26302D"/>
<text x="40" y="58" fill="#F2F5F4" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">Current Focus</text>
<line x1="40" y1="80" x2="1160" y2="80" stroke="#26302D" stroke-width="2"/>
<text x="40" y="122" fill="#9BA6A3" font-family="Arial,Helvetica,sans-serif" font-size="17">Building reliable, scalable product infrastructure where performance,</text>
<text x="40" y="151" fill="#9BA6A3" font-family="Arial,Helvetica,sans-serif" font-size="17">maintainability, security, and product velocity work together.</text>
<rect x="40" y="182" width="8" height="34" rx="4" fill="url(#accent)"/>
<text x="68" y="205" fill="#F2F5F4" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">Build systems that don't just work. Build systems that keep working as everything grows.</text>
</svg>
