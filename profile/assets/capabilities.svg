<rect width="1200" height="610" rx="20" fill="#0B0D0D" stroke="#26302D"/><rect x="35" y="30" width="550" height="250" rx="16" fill="#121515" stroke="#26302D"/><rect x="35" y="30" width="4" height="250" rx="2" fill="url(#accent)"/><text x="63" y="78" fill="#F2F5F4" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">API Architecture</text><text x="63" y="118" fill="#9BA6A3" font-family="Arial,Helvetica,sans-serif" font-size="17">REST &amp; GraphQL systems with clear contracts,</text><text x="63" y="146" fill="#9BA6A3" font-family="Arial,Helvetica,sans-serif" font-size="17">secure authentication, and maintainable service boundaries.</text><rect x="63" y="190" width="56" height="28" rx="14" fill="#151919" stroke="#00C98A"/><text x="91" y="209" text-anchor="middle" fill="#8DFFD4" font-family="Arial,Helvetica,sans-serif" font-size="13">REST</text><rect x="129.4" y="190" width="81" height="28" rx="14" fill="#151919" stroke="#00C98A"/><text x="170" y="209" text-anchor="middle" fill="#8DFFD4" font-family="Arial,Helvetica,sans-serif" font-size="13">GraphQL</text><rect x="220.1" y="190" width="56" height="28" rx="14" fill="#151919" stroke="#00C98A"/><text x="248" y="209" text-anchor="middle" fill="#8DFFD4" font-family="Arial,Helvetica,sans-serif" font-size="13">Auth</text><rect x="286.5" y="190" width="137" height="28" rx="14" fill="#151919" stroke="#00C98A"/><text x="355" y="209" text-anchor="middle" fill="#8DFFD4" font-family="Arial,Helvetica,sans-serif" font-size="13">Service Design</text><rect x="615" y="30" width="550" height="250" rx="16" fill="#121515" stroke="#26302D"/><rect x="615" y="30" width="4" height="250" rx="2" fill="url(#accent)"/><text x="643" y="78" fill="#F2F5F4" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">Scalable Front-Ends</text><text x="643" y="118" fill="#9BA6A3" font-family="Arial,Helvetica,sans-serif" font-size="17">React and Next.js interfaces built around</text><text x="643" y="146" fill="#9BA6A3