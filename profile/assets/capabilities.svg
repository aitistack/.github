ext><rect x="293.0" y="470" width="48" height="28" rx="14" fill="#151919" stroke="#00C98A"/><text x="317" y="489" text-anchor="middle" fill="#8DFFD4" font-family="Arial,Helvetica,sans-serif" font-size="13">AWS</text><rect x="351.3" y="470" width="89" height="28" rx="14" fill="#151919" stroke="#00C98A"/><text x="396" y="489" text-anchor="middle" fill="#8DFFD4" font-family="Arial,Helvetica,sans-serif" font-size="13">Firebase</text><rect x="615" y="310" width="550" height="250" rx="16" fill="#121515" stroke="#26302D"/><rect x="615" y="310" width="4" height="250" rx="2" fill="url(#accent)"/><text x="643" y="358" fill="#F2F5F4" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">System Optimization</text><text x="643" y="398" fill="#9BA6A3" font-family="Arial,Helvetica,sans-serif" font-size="17">Backend tuning, database scaling, real-time</text><text x="643" y="426" fill="#9BA6A3" font-family="Arial,Helvetica,sans-serif" font-size="17">communication, and reliability-minded delivery.</text><rect x="643" y="470" width="97" height="28" rx="14" fill="#151919" stroke="#00C98A"/><text x="691" y="489" text-anchor="middle" fill="#8DFFD4" font-family="Arial,Helvetica,sans-serif" font-size="13">Databases</text><rect x="749.9" y="470" width="89" height="28" rx="14" fill="#151919" stroke="#00C98A"/><text x="794" y="489" text-anchor="middle" fill="#8DFFD4" font-family="Arial,Helvetica,sans-serif" font-size="13">Realtime</text><rect x="848.6999999999999" y="470" width="73" height="28" rx="14" fill="#151919" stroke="#00C98A"/><text x="885" y="489" text-anchor="middle" fill="#8DFFD4" font-family="Arial,Helvetica,sans-serif" font-size="13">Queues</text><rect x="931.3" y="470" width="129" height="28" rx="14" fill="#151919" stroke="#00C98A"/><text x="996" y="489" text-anchor="middle" fill="#8DFFD4" font-family="Arial,Helvetica,sans-serif" font-size="13">Observability</text></svg>
