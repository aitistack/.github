<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00F5A0"/>
    <stop offset="1" stop-color="#00C98A"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1200" height="300" rx="20" fill="#0B0D0D" stroke="#26302D"/><text x="40" y="55" fill="#F2F5F4" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">Engineering Principles</text><line x1="40" y1="78" x2="1160" y2="78" stroke="#26302D" stroke-width="2"/><text x="45" y="112" fill="#00F5A0" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">01</text><text x="85" y="112" fill="#F2F5F4" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">SHIP FAST</text><text x="275" y="112" fill="#9BA6A3" font-family="Arial,Helvetica,sans-serif" font-size="14">Move from idea to production without unnecessary complexity.</text><text x="45" y="155" fill="#00F5A0" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">02</text><text x="85" y="155" fill="#F2F5F4" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">SCALE CLEAN</text><text x="275" y="155" fill="#9BA6A3" font-family="Arial,Helvetica,sans-serif" font-size="14">Design service boundaries and data flows that grow with the product.</text><text x="45" y="198" fill="#00F5A0" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">03</text><text x="85" y="198" fill="#F2F5F4" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">SECURE DEFAULTS</text><text x="275" y="198" fill="#9BA6A3" font-family="Arial,Helvetica,sans-serif" font-size="14">Treat auth, validation, and infrastructure security as architecture.</text><text x="45" y="241" fill="#00F5A0" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">04</text><text x="85" y="241" fill="#F2F5F4" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">MEASURE IMPACT</text><text x="275" y="241" fill="#9BA6A3" font-family="Arial,Helvetica,sans-serif" font-size="14">Use performance, reliability, and product signals to guide decisions.</text></svg>
